<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Métricas YouTube</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span> Painel YouTube</div>
  <nav class="tabs" id="tabs">
    <button data-tab="geral" class="active">Visão Geral</button>
    <button data-tab="comparar">Comparar Canais</button>
    <button data-tab="canal">Análise do Canal</button>
    <button data-tab="videos">Todos os Vídeos</button>
  </nav>
  <div class="controls">
    <label class="ctl">Janela
      <select id="sel-janela">
        <option value="7">Últimos 7 dias</option>
        <option value="30" selected>Últimos 30 dias</option>
        <option value="90">Últimos 90 dias</option>
        <option value="0">Tudo (até 150 vídeos/canal)</option>
      </select>
    </label>
    <button id="btn-refresh" class="btn">↻ Atualizar</button>
  </div>
</header>

<div id="aviso" class="aviso" hidden></div>
<div id="status" class="status"></div>

<main>
  <!-- VISÃO GERAL -->
  <section id="tab-geral" class="tab active">
    <div class="kpis" id="kpi-geral"></div>
    <div class="grid" id="grid-geral"></div>
    <div class="card w12">
      <h3>Ranking dos canais</h3>
      <p class="sub">Clique no título da coluna para ordenar.</p>
      <div class="table-wrap" id="tb-geral"></div>
    </div>
  </section>

  <!-- COMPARAR -->
  <section id="tab-comparar" class="tab">
    <div class="kpis" id="kpi-comparar"></div>
    <div class="grid" id="grid-comparar"></div>
    <div class="card w12">
      <h3>Métricas detalhadas por canal</h3>
      <p class="sub">Calculadas sobre a janela de tempo escolhida no topo.</p>
      <div class="table-wrap" id="tb-comparar"></div>
    </div>
  </section>

  <!-- CANAL -->
  <section id="tab-canal" class="tab">
    <div class="canal-head">
      <img id="canal-foto" alt="">
      <div>
        <h2 id="canal-nome">—</h2>
        <select id="sel-canal"></select>
      </div>
    </div>
    <div class="kpis" id="kpi-canal"></div>
    <div class="card w12">
      <h3>💡 Diagnóstico automático</h3>
      <ul id="insights" class="insights"></ul>
    </div>
    <div class="grid" id="grid-canal"></div>
    <div class="grid">
      <div class="card w6"><h3>🏆 Top 5 vídeos</h3><div id="lista-top" class="vlist"></div></div>
      <div class="card w6"><h3>⚠️ 5 piores vídeos</h3><div id="lista-bottom" class="vlist"></div></div>
    </div>
  </section>

  <!-- VÍDEOS -->
  <section id="tab-videos" class="tab">
    <div class="card w12">
      <div class="filtros">
        <input id="flt-busca" type="search" placeholder="Buscar no título…">
        <select id="flt-canal"></select>
      </div>
      <div class="table-wrap" id="tb-videos"></div>
    </div>
  </section>
</main>

<div id="loading" class="loading"><div class="spinner"></div><span id="loading-txt">Carregando dados…</span></div>

<script src="app.js"></script>
</body>
</html>
